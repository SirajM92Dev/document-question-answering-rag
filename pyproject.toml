[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-qa-rag"
version = "1.0.0"
description = "Production-ready document question answering with retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SirajM92Dev" }]
dependencies = [
  "chromadb>=0.5.0",
  "fastapi>=0.115.0",
  "openai>=1.50.0",
  "pydantic-settings>=2.6.0",
  "pypdf>=5.0.0",
  "python-multipart>=0.0.12",
  "sentence-transformers>=3.2.0",
  "tenacity>=9.0.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.3.0", "pytest-cov>=5.0.0", "ruff>=0.7.0"]

[project.scripts]
rag = "rag_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
